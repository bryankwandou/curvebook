# Daily read-only refresh of the published mainnet data: the graduation scan and the launched pool's state.
# Needs the repo secret HELIUS_RPC (a mainnet RPC URL). No keys, nothing is signed.
name: data
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the RPC secret
        env:
          RPC: ${{ secrets.HELIUS_RPC }}
        run: |
          if [ -z "$RPC" ]; then echo "::error::HELIUS_RPC secret is empty; refusing to report success"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan graduations
        env:
          RPC: ${{ secrets.HELIUS_RPC }}
          PER_ADDRESS: 200
          CONCURRENCY: 8
          DELAY: 150
        run: npx tsx scripts/scan-graduations.ts
      - name: Measure what happened to the graduation liquidity
        env:
          RPC: ${{ secrets.HELIUS_RPC }}
        run: npx tsx scripts/lp-outcomes.ts
      - name: Read the launched pool
        env:
          RPC: ${{ secrets.HELIUS_RPC }}
        run: npx tsx scripts/pool-state.ts
      - name: Re-check the four live presets for risk flags
        env:
          RPC: ${{ secrets.HELIUS_RPC }}
        # --json so the step can also prove every preset was checked: an argument bug once skipped the first one silently
        run: |
          configs=$(node -p "Object.values(require('./src/deployed.json')).map(d => d.config).join(' ')")
          npx tsx scripts/check.ts --fail-on warn --json $configs > checked.json
          node -e "const r = require('./checked.json'); const n = $(echo $configs | wc -w); if (r.length !== n || r.some((x) => !x.pass)) { console.error(JSON.stringify(r, null, 2)); process.exit(1) } console.log('checked', r.length, 'presets, all pass')"
      - name: Smoke-test the live API on known cases
        run: node scripts/smoke.mjs
      - name: Sanity check before publishing
        run: |
          n=$(node -p "require('./graduated-configs.json').graduatedPools")
          if [ "$n" -lt 500 ]; then echo "::error::only $n graduations read; RPC likely failed partway"; exit 1; fi
          npm test
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graduated-configs.json graduation-history.json lp-outcomes.json mainnet-pool-state.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "data: daily mainnet refresh $(date -u +%F)"
          # main may have moved while the scan ran; only data files are committed here, so a rebase cannot conflict with code
          git pull --rebase origin main
          git push
