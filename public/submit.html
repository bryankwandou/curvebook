<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>curvebook submission</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg:#f6f4ef; --surface:#fff; --ink:#17171a; --muted:#5d5d66; --line:#e2ded5; --accent:#e8590c; --ok:#2b8a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --surface:#1a1a1f; --ink:#ececf1; --muted:#9a9aa6; --line:#2c2c33; --accent:#ff8a3d; --ok:#51cf66; } }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 Inter,system-ui,-apple-system,'Segoe UI',sans-serif }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 6px }
  .sub { color:var(--muted); margin:0 0 24px }
  .sub a { color:var(--accent) }
  .field { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px }
  .label { font-weight:650; font-size:14px }
  .note { color:var(--muted); font-size:13px; margin-top:6px }
  .val { white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px }
  .val.empty { color:var(--muted); font-style:italic }
  button { font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:5px 12px; cursor:pointer; flex:none }
  button.done { color:var(--ok); border-color:var(--ok) }
</style>
</head>
<body>
<main>
  <h1>curvebook: track submission</h1>
  <p class="sub">Answers for the <a href="https://superteam.fun/earn/listing/meteora-dbc">Meteora DBC listing</a> on Superteam Earn. Copy each field into the form.</p>
  <div id="fields"></div>
</main>
<script>
const SITE = 'https://curvebook-kappa.vercel.app'
const F = [
  ['Link to Your Submission', SITE + '/demo', 'Demo video page, with links to the app, the on-chain run and GitHub.'],
  ['Tweet Link', 'https://x.com/nayrbryanGaming/status/2108845716999422019'],
  ['Tweet text (not a form field)', `62% of 1,787 @MeteoraAG DBC graduations we decoded were direct listings: price moved 1.25x or less.

curvebook: paste any DBC config, see what its curve, fees and LP lock really do. Or launch on presets built for price discovery, live on mainnet.

https://curvebook-kappa.vercel.app/demo`, 'Post this on X with the button, then paste the tweet URL into Tweet Link above. Attach demo.mp4 for an inline video if you can.', 'x'],
  ['Tweet 2: the liquidity finding (not a form field)', `62% of 1,792 @MeteoraAG DBC graduations came from configs leaving most of the LP withdrawable.

71% of those pools have since lost half or more of their liquidity. Fully locked configs: 2%.

One pool was emptied 3 min after graduating.

Check a config: https://curvebook-kappa.vercel.app`, 'Post it, then reply to your first tweet with its link so both stay together.', 'x'],
  ['Post for the Meteora dev Discord / Telegram (not a form field)', `Built a free, read-only pre-launch check for DBC configs: https://curvebook-kappa.vercel.app

Paste a config address and it flags mint authority, LP that is not permanently locked, fees that never decay, creator vesting and sniper advantage. Same check from a terminal or CI: npx tsx scripts/check.ts <config> (exit 1 on a red flag). Repo: https://github.com/bryankwandou/curvebook

Data behind it: of 1,792 recent graduations, 62% were on configs leaving most of the LP withdrawable, and 71% of those pools have since lost half their liquidity (2% on fully locked configs). Method and control are on the site.

If you run a launchpad on DBC, I'd value 2 minutes: run it on your config and tell me what it gets wrong or misses.`, 'Discord: discord.com/channels/841152225564950528/864859354335412224 · Telegram: t.me/meteora_dev (both from the listing). Answer replies yourself; their feedback is the traction.'],
  ['Project Name', 'curvebook'],
  ['Project Description', `We decoded the config behind 1,792 recent DBC graduations on mainnet. 1,103 of them (62%) came from configs that leave half or more of the graduation LP withdrawable by the launchpad or creator. We then checked each pool's DAMM liquidity today: 71% of those have since lost half or more of the liquidity they graduated with. On configs that lock all LP, 2%. One pool had all of its liquidity removed 3 minutes 23 seconds after graduating. None of this is visible without decoding the config account.

curvebook is a check for DBC tokens and configs. Paste a token, its pool, or a launchpad's config: it finds the config, reads it from mainnet, walks the curve with the SDK math, and flags what matters to a buyer: mint authority kept, LP not permanently locked, fees that never decay, supply vesting to the creator, migration fees, and how far ahead early buyers are at graduation. For a token that already graduated it reads the migration transaction and the DAMM pool today and shows how much of the liquidity is gone. The same checks run from a terminal (scripts/check.ts, exit 1 on a red flag), so a launchpad can gate its configs in CI. Every report has a shareable link.

The scan reruns every day in GitHub Actions and the site reads the latest data, so the numbers above move.

For launchpads that want a clean starting point, curvebook ships four configs that pass every check, each live on mainnet: Flat Fair (5x), Early Discovery (16x, anti-snipe fee 25% to 1% over 120 s), Long Curve (20x, 90% of supply on the curve), and a narrow USDC band (1.8x). All lock 100% of LP and migrate to DAMM v2. A launchpad can deploy any of them under its own wallet with one createConfig, or launch on ours, which pays the preset author through DBC's fee claimer.

How we know it works:
- 4 configs live on mainnet, read back by scripts/verify-mainnet.ts: 80 checks, 0 failures
- one token launched on mainnet on the Flat Fair config
- the full lifecycle on devnet: buy to 100%, migrateToDammV2, both DAMM v2 LP positions permanently locked
- the risk rules are unit-tested, and CI runs lint, build and tests on every push
- the liquidity study has a control: pools on configs that lock all LP (2% lost half), and npm test fails if that rises above 10%

No users yet beyond us. That is the next step.`],
  ['Project Github Link', 'https://github.com/bryankwandou/curvebook'],
  ['Project Website', SITE],
  ['Project X Link', 'https://x.com/nayrbryanGaming'],
  ['Link to your pitch deck or Loom/video presentation', SITE + '/demo'],
  ["Did you submit this project to the official Crypto World's Fair Hackathon on Colosseum? (Yes/No)", 'No', 'curvebook is not a Colosseum project. Do not link Commish here.'],
  ['Link to Colosseum project', '', 'Leave empty.'],
  ["Link to your project's Colosseum profile", 'https://colosseum.com/arena/profiles/nayrbryanGaming'],
  ['Anything Else?', `Repo is public. \`npx tsx scripts/verify-presets.ts\` re-runs the SDK validator and the mainnet createConfig simulation for every preset. \`scripts/devnet-proof.ts\` runs config → launch → buy on devnet; results are on ${SITE}/#proof and in devnet-proof.json. Mainnet configs (created by \`scripts/deploy-configs.ts\`): flat-fair 7Cybv7xUZn3JhvZfGQF9h9s7bLWQhNNcqs1yQVGPprPK, early-discovery FnKvUoL12VZacUE2k4EwhFXHn2xxhoG1wvQYsfgBSsLT, long-curve 6aHuAvXw3BYgR5Wrht8neBPXpmGQej7YWhBK9gbDyf93, stock-pair-usdc 4i2iNBaHyJbbZL5q3TVRudzySRbf8NV3BmhscAiQTEhU. \`N=5000 npx tsx scripts/fuzz-curves.ts\` reproduces the 5,000-case test (fuzz-report.json). \`npx tsx scripts/mainnet-sim.ts\` reproduces the mainnet simulation (mainnet-sim.json). Mainnet launch: \`scripts/mainnet-launch.ts\`, createPool tx 5ieP6wibq9FN1vC5fGXwAFrZkKBEjeHQ27ZFnMSyeg6p2PBQ8vDL5WhZnnAwZHYfjTKFKsZcjHjN8KH1dsrZw3Pu, buy tx 2UtVTgnBaEh59h3Cz72VCYo9EvwN3idg7CvptUoPXd6gsPF88vedSFMHrgNyvSLichGkxHmK9VjKfFLW86DwURSn (mainnet-launch.json). \`npx tsx scripts/verify-mainnet.ts\` re-reads all four configs from mainnet: 80 checks, 0 failures. Graduation: \`scripts/devnet-graduate.ts\` runs createConfig → createPool → buy to 100% → migrateToDammV2 on devnet and reads the DAMM v2 pool and LP positions back (devnet-graduation.json; DAMM v2 pool 5hiCfh8heVN8G14pJtHTU4pF3y5M46SeS81tB8y8qbSS, migrate tx 2Pt9y7zJXyNb94aLv7WRvR9DxjPsv4EhkTkTBLTTUfTNbQ6jhGTiGJSXc63Lu7HsHuXEPuJ3z8YqtfvAT9m4DCJB). Config Inspector: ${SITE}/#inspect reads any DBC config from mainnet in the browser (src/lib/inspect.ts). \`scripts/scan-graduations.ts\` takes the latest 200 transactions on each DAMM migration config, finds the DBC config named by each migrate instruction (IDL discriminator, account #2) and decodes every config (graduated-configs.json, refreshed daily by .github/workflows/data.yml; the latest numbers are on the site). Pre-launch check from a terminal or CI: npx tsx scripts/check.ts <config> (risk rules in src/lib/risk.ts, unit-tested in scripts/test.ts). Busy migration configs cover days and quiet ones months, so it is a sample, not a time series. Liquidity outcome study: scripts/lp-outcomes.ts compares each graduated pool's DAMM liquidity at migration with today, with fully locked configs as the control (lp-outcomes.json; hand-checked cases in the README). How the DAMM v2 permanent lock holds, read from the program source, and who can upgrade DBC and DAMM v2: README, 'How the LP lock holds'. Threshold sensitivity of the listing share: the Method panel on the site. Demo video (mp4): ${SITE}/x-demo.mp4`],
]
const root = document.getElementById('fields')
for (const [label, value, note] of F) {
  const el = document.createElement('div')
  el.className = 'field'
  el.innerHTML = `<div class="head"><span class="label"></span></div><div class="val"></div>`
  el.querySelector('.label').textContent = label
  const v = el.querySelector('.val')
  v.textContent = value || '(empty)'
  if (!value) v.classList.add('empty')
  if (value) {
    const b = document.createElement('button')
    b.textContent = 'Copy'
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = 'Copied'; b.classList.add('done') }
      catch { const r = document.createRange(); r.selectNodeContents(v); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected: Ctrl+C' }
    }
    el.querySelector('.head').appendChild(b)
  }
  if (value && F.find((f) => f[0] === label)[3] === 'x') {
    const a = document.createElement('a'); a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(value); a.target = '_blank'; a.rel = 'noopener'
    a.textContent = 'Post on X'; a.style.cssText = 'margin-left:8px;font-size:13px;font-weight:600;color:var(--accent)'
    el.querySelector('.head').appendChild(a)
  }
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; el.appendChild(n) }
  root.appendChild(el)
}
</script>
</body>
</html>
