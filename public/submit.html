<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>curvebook submission</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg:#f6f4ef; --surface:#fff; --ink:#17171a; --muted:#5d5d66; --line:#e2ded5; --accent:#e8590c; --ok:#2b8a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --surface:#1a1a1f; --ink:#ececf1; --muted:#9a9aa6; --line:#2c2c33; --accent:#ff8a3d; --ok:#51cf66; } }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 Inter,system-ui,-apple-system,'Segoe UI',sans-serif }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 6px }
  .sub { color:var(--muted); margin:0 0 24px }
  .sub a { color:var(--accent) }
  .field { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px }
  .label { font-weight:650; font-size:14px }
  .note { color:var(--muted); font-size:13px; margin-top:6px }
  .val { white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px }
  .val.empty { color:var(--muted); font-style:italic }
  button { font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:5px 12px; cursor:pointer; flex:none }
  button.done { color:var(--ok); border-color:var(--ok) }
</style>
</head>
<body>
<main>
  <h1>curvebook: track submission</h1>
  <p class="sub">Answers for the <a href="https://superteam.fun/earn/listing/meteora-dbc">Meteora DBC listing</a> on Superteam Earn. Copy each field into the form.</p>
  <div id="fields"></div>
</main>
<script>
const SITE = 'https://curvebook-kappa.vercel.app'
const F = [
  ['Link to Your Submission', SITE + '/demo', 'Demo video page, with links to the app, the on-chain run and GitHub.'],
  ['Tweet Link', '', 'Optional. Leave empty, or paste your own announcement tweet.'],
  ['Tweet text (not a form field)', `curvebook: a preset marketplace for @MeteoraAG Dynamic Bonding Curve configs.

4 launch curves live on Solana mainnet (flat fair, anti-snipe, long curve, USDC stock pair), first token launched on one.

Pick a curve. Launch on it. Or fork it.
https://curvebook-kappa.vercel.app/demo`, 'Post this on X with the button, then paste the tweet URL into Tweet Link above. Attach demo.mp4 for an inline video if you can.', 'x'],
  ['Project Name', 'curvebook'],
  ['Project Description', `Live on Solana mainnet: 4 preset configs owned by the DBC program, and a first token (CBK) launched on one of them.

curvebook is a preset marketplace for Meteora Dynamic Bonding Curve configs. Most launchpads copy one pump-style curve and never touch the rest of DBC. curvebook packages tuned configs (curve shape, fee schedule, quote token, graduation threshold, LP split, DAMM v2 migration) as presets you can compare on one chart and adopt in a single transaction.

Four presets ship today:
- Flat Fair Launch (SOL): equal liquidity in all 16 segments, 5x from open to graduation, so early snipers get no 10x edge.
- Early Discovery (SOL): thin bottom, 16x, with a 25% → 1% exponential anti-snipe fee over 120 s.
- Long Curve (SOL): deep bottom, 20x, with 90% of supply sold on the curve for slow accumulation.
- Stock Pair (USDC): USDC-quoted narrow band (1.8x) at a 0.3% fee, built for price discovery on tokenized equities.

The pay-to-use model runs on DBC's own fee-claimer rail. Launching on an official preset pays the preset author the pool-creation fee and the author share of trading fees. A launchpad can also deploy the identical curve under its own wallet with one createConfig and keep those fees itself. A Builder lets anyone tune shape, market caps, fee decay and fee split, validated live with the SDK's validateConfigParameters.

All four preset configs are live on Solana mainnet (config accounts owned by the DBC program, links on the site), and a read-back of each account matches its preset on 80 of 80 checks. A real token (CBK) has launched on the Flat Fair config with a 0.01 SOL first buy: pool 4ikgpisQo83h3wBwtaqW8mhRuHbjM9L2egv9Fq7XY1zd, curve 2.08% filled right after that buy. Within seconds a third-party wallet traded the pool (buys and sells), so the live curve now reads lower; that trading has already paid 0.016 SOL in fees to the preset author (read-back: scripts/pool-state.ts). A launch with a 1 SOL first buy on each live config, run through simulateTransaction against the mainnet DBC program, succeeds 4 of 4; the simulated pool state shows the preset author earning 0.138 SOL from one Early Discovery launch (0.018 SOL creation fee after the 10% protocol cut + 0.12 SOL trading fee), over 20x the 0.006 SOL config rent. A 5,000-case randomized test runs random configs through the same SDK path and checks curve invariants: 0 failures, and every deliberately broken config was rejected. The full flow has also run on devnet against the same program: createConfig, createPool and a 0.2 SOL buy for every SOL preset, with all signatures on the site. The same buy moved Early Discovery half as far because its 25% opening fee kept a quarter of the input, which shows the anti-snipe fee working. Graduation has also run end to end on devnet: a Flat Fair pool (market caps scaled down to fit a devnet budget) filled to 100%, migrated with migrateToDammV2, and the read-back shows a DAMM v2 pool with both LP positions 100% permanently locked.`],
  ['Project Github Link', 'https://github.com/bryankwandou/curvebook'],
  ['Project Website', SITE],
  ['Project X Link', '', 'Your X profile link.'],
  ['Link to your pitch deck or Loom/video presentation', SITE + '/demo'],
  ["Did you submit this project to the official Crypto World's Fair Hackathon on Colosseum? (Yes/No)", 'No', 'curvebook is not a Colosseum project. Do not link Commish here.'],
  ['Link to Colosseum project', '', 'Leave empty.'],
  ["Link to your project's Colosseum profile", '', 'Optional: your own Colosseum profile link, or leave empty.'],
  ['Anything Else?', `Repo is public. \`npx tsx scripts/verify-presets.ts\` re-runs the SDK validator and the mainnet createConfig simulation for every preset. \`scripts/devnet-proof.ts\` runs config → launch → buy on devnet; results are on ${SITE}/#proof and in devnet-proof.json. Mainnet configs (created by \`scripts/deploy-configs.ts\`): flat-fair 7Cybv7xUZn3JhvZfGQF9h9s7bLWQhNNcqs1yQVGPprPK, early-discovery FnKvUoL12VZacUE2k4EwhFXHn2xxhoG1wvQYsfgBSsLT, long-curve 6aHuAvXw3BYgR5Wrht8neBPXpmGQej7YWhBK9gbDyf93, stock-pair-usdc 4i2iNBaHyJbbZL5q3TVRudzySRbf8NV3BmhscAiQTEhU. \`N=5000 npx tsx scripts/fuzz-curves.ts\` reproduces the 5,000-case test (fuzz-report.json). \`npx tsx scripts/mainnet-sim.ts\` reproduces the mainnet simulation (mainnet-sim.json). Mainnet launch: \`scripts/mainnet-launch.ts\`, createPool tx 5ieP6wibq9FN1vC5fGXwAFrZkKBEjeHQ27ZFnMSyeg6p2PBQ8vDL5WhZnnAwZHYfjTKFKsZcjHjN8KH1dsrZw3Pu, buy tx 2UtVTgnBaEh59h3Cz72VCYo9EvwN3idg7CvptUoPXd6gsPF88vedSFMHrgNyvSLichGkxHmK9VjKfFLW86DwURSn (mainnet-launch.json). \`npx tsx scripts/verify-mainnet.ts\` re-reads all four configs from mainnet: 80 checks, 0 failures. Graduation: \`scripts/devnet-graduate.ts\` runs createConfig → createPool → buy to 100% → migrateToDammV2 on devnet and reads the DAMM v2 pool and LP positions back (devnet-graduation.json; DAMM v2 pool 5hiCfh8heVN8G14pJtHTU4pF3y5M46SeS81tB8y8qbSS, migrate tx 2Pt9y7zJXyNb94aLv7WRvR9DxjPsv4EhkTkTBLTTUfTNbQ6jhGTiGJSXc63Lu7HsHuXEPuJ3z8YqtfvAT9m4DCJB). Demo video (mp4): ${SITE}/x-demo.mp4`],
]
const root = document.getElementById('fields')
for (const [label, value, note] of F) {
  const el = document.createElement('div')
  el.className = 'field'
  el.innerHTML = `<div class="head"><span class="label"></span></div><div class="val"></div>`
  el.querySelector('.label').textContent = label
  const v = el.querySelector('.val')
  v.textContent = value || '(empty)'
  if (!value) v.classList.add('empty')
  if (value) {
    const b = document.createElement('button')
    b.textContent = 'Copy'
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = 'Copied'; b.classList.add('done') }
      catch { const r = document.createRange(); r.selectNodeContents(v); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected: Ctrl+C' }
    }
    el.querySelector('.head').appendChild(b)
  }
  if (value && F.find((f) => f[0] === label)[3] === 'x') {
    const a = document.createElement('a'); a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(value); a.target = '_blank'; a.rel = 'noopener'
    a.textContent = 'Post on X'; a.style.cssText = 'margin-left:8px;font-size:13px;font-weight:600;color:var(--accent)'
    el.querySelector('.head').appendChild(a)
  }
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; el.appendChild(n) }
  root.appendChild(el)
}
</script>
</body>
</html>
