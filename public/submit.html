<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>curvebook submission</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg:#f6f4ef; --surface:#fff; --ink:#17171a; --muted:#5d5d66; --line:#e2ded5; --accent:#e8590c; --ok:#2b8a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --surface:#1a1a1f; --ink:#ececf1; --muted:#9a9aa6; --line:#2c2c33; --accent:#ff8a3d; --ok:#51cf66; } }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 Inter,system-ui,-apple-system,'Segoe UI',sans-serif }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 6px }
  .sub { color:var(--muted); margin:0 0 24px }
  .sub a { color:var(--accent) }
  .field { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px }
  .label { font-weight:650; font-size:14px }
  .note { color:var(--muted); font-size:13px; margin-top:6px }
  .val { white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px }
  .val.empty { color:var(--muted); font-style:italic }
  button { font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:5px 12px; cursor:pointer; flex:none }
  button.done { color:var(--ok); border-color:var(--ok) }
</style>
</head>
<body>
<main>
  <h1>curvebook: track submission</h1>
  <p class="sub">Answers for the <a href="https://superteam.fun/earn/listing/meteora-dbc">Meteora DBC listing</a> on Superteam Earn. Copy each field into the form.</p>
  <div id="fields"></div>
</main>
<script>
const SITE = 'https://curvebook-kappa.vercel.app'
const F = [
  ['Link to Your Submission', SITE + '/demo', 'Demo video page, with links to the app, the on-chain run and GitHub.'],
  ['Tweet Link', '', 'Optional. Leave empty, or paste your own announcement tweet.'],
  ['Tweet text (not a form field)', `curvebook: a preset marketplace for @MeteoraAG Dynamic Bonding Curve configs.

4 launch curves live on Solana mainnet (flat fair, anti-snipe, long curve, USDC stock pair), first token launched on one.

Pick a curve. Launch on it. Or fork it.
https://curvebook-kappa.vercel.app/demo`, 'Post this on X with the button, then paste the tweet URL into Tweet Link above. Attach demo.mp4 for an inline video if you can.', 'x'],
  ['Project Name', 'curvebook'],
  ['Project Description', `Live on Solana mainnet: 4 preset DBC configs, and a first token launched on one of them.

curvebook is a preset marketplace and inspector for Meteora Dynamic Bonding Curve configs. Most launchpads copy one pump-style curve. curvebook packages full configs (curve shape, fee schedule, quote token, graduation threshold, LP lock, DAMM v2 migration) as presets you can compare on one chart and launch on in one transaction.

Presets:
- Flat Fair Launch (SOL): equal liquidity in all 16 segments, 5x from open to graduation.
- Early Discovery (SOL): thin bottom, 16x, anti-snipe fee from 25% down to 1% over 120 s.
- Long Curve (SOL): deep bottom, 20x, 90% of supply sold on the curve.
- Stock Pair (USDC): narrow 1.8x band at 0.3%, for tokenized equities.

Pay-to-use uses DBC's own fee-claimer: launching on a preset pays its author the pool-creation fee and a share of trading fees. A launchpad can also deploy the same curve under its own wallet with one createConfig. The Builder tunes every parameter and checks it with the SDK validator.

Config Inspector: paste any DBC config address and the site reads it from mainnet, decodes curve, fees, migration and LP lock, and names the closest preset. A scan of the latest 1,792 mainnet graduations ranks the configs that actually graduate.

What you can check:
- 80/80 read-back checks of the 4 live configs (scripts/verify-mainnet.ts)
- first mainnet launch plus a 0.01 SOL buy; a third-party wallet traded the pool within seconds and paid the preset author 0.016 SOL in fees
- full lifecycle on devnet: buy to 100%, migrateToDammV2, DAMM v2 pool with both LP positions 100% permanently locked
- 5,000 randomized curve tests, 0 failures`],
  ['Project Github Link', 'https://github.com/bryankwandou/curvebook'],
  ['Project Website', SITE],
  ['Project X Link', '', 'Your X profile link.'],
  ['Link to your pitch deck or Loom/video presentation', SITE + '/demo'],
  ["Did you submit this project to the official Crypto World's Fair Hackathon on Colosseum? (Yes/No)", 'No', 'curvebook is not a Colosseum project. Do not link Commish here.'],
  ['Link to Colosseum project', '', 'Leave empty.'],
  ["Link to your project's Colosseum profile", '', 'Optional: your own Colosseum profile link, or leave empty.'],
  ['Anything Else?', `Repo is public. \`npx tsx scripts/verify-presets.ts\` re-runs the SDK validator and the mainnet createConfig simulation for every preset. \`scripts/devnet-proof.ts\` runs config → launch → buy on devnet; results are on ${SITE}/#proof and in devnet-proof.json. Mainnet configs (created by \`scripts/deploy-configs.ts\`): flat-fair 7Cybv7xUZn3JhvZfGQF9h9s7bLWQhNNcqs1yQVGPprPK, early-discovery FnKvUoL12VZacUE2k4EwhFXHn2xxhoG1wvQYsfgBSsLT, long-curve 6aHuAvXw3BYgR5Wrht8neBPXpmGQej7YWhBK9gbDyf93, stock-pair-usdc 4i2iNBaHyJbbZL5q3TVRudzySRbf8NV3BmhscAiQTEhU. \`N=5000 npx tsx scripts/fuzz-curves.ts\` reproduces the 5,000-case test (fuzz-report.json). \`npx tsx scripts/mainnet-sim.ts\` reproduces the mainnet simulation (mainnet-sim.json). Mainnet launch: \`scripts/mainnet-launch.ts\`, createPool tx 5ieP6wibq9FN1vC5fGXwAFrZkKBEjeHQ27ZFnMSyeg6p2PBQ8vDL5WhZnnAwZHYfjTKFKsZcjHjN8KH1dsrZw3Pu, buy tx 2UtVTgnBaEh59h3Cz72VCYo9EvwN3idg7CvptUoPXd6gsPF88vedSFMHrgNyvSLichGkxHmK9VjKfFLW86DwURSn (mainnet-launch.json). \`npx tsx scripts/verify-mainnet.ts\` re-reads all four configs from mainnet: 80 checks, 0 failures. Graduation: \`scripts/devnet-graduate.ts\` runs createConfig → createPool → buy to 100% → migrateToDammV2 on devnet and reads the DAMM v2 pool and LP positions back (devnet-graduation.json; DAMM v2 pool 5hiCfh8heVN8G14pJtHTU4pF3y5M46SeS81tB8y8qbSS, migrate tx 2Pt9y7zJXyNb94aLv7WRvR9DxjPsv4EhkTkTBLTTUfTNbQ6jhGTiGJSXc63Lu7HsHuXEPuJ3z8YqtfvAT9m4DCJB). Config Inspector: ${SITE}/#inspect reads any DBC config from mainnet in the browser (src/lib/inspect.ts). \`scripts/scan-graduations.ts\` finds the DBC config of each of the latest 1,792 mainnet graduations by the migrate instruction's IDL discriminator (graduated-configs.json): 632 configs; 7 of the 8 most-graduated (517 of the 1,792 graduations) move price 1.2x or less or graduate at under 0.01 SOL: direct listings, not curve price discovery. Demo video (mp4): ${SITE}/x-demo.mp4`],
]
const root = document.getElementById('fields')
for (const [label, value, note] of F) {
  const el = document.createElement('div')
  el.className = 'field'
  el.innerHTML = `<div class="head"><span class="label"></span></div><div class="val"></div>`
  el.querySelector('.label').textContent = label
  const v = el.querySelector('.val')
  v.textContent = value || '(empty)'
  if (!value) v.classList.add('empty')
  if (value) {
    const b = document.createElement('button')
    b.textContent = 'Copy'
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = 'Copied'; b.classList.add('done') }
      catch { const r = document.createRange(); r.selectNodeContents(v); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected: Ctrl+C' }
    }
    el.querySelector('.head').appendChild(b)
  }
  if (value && F.find((f) => f[0] === label)[3] === 'x') {
    const a = document.createElement('a'); a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(value); a.target = '_blank'; a.rel = 'noopener'
    a.textContent = 'Post on X'; a.style.cssText = 'margin-left:8px;font-size:13px;font-weight:600;color:var(--accent)'
    el.querySelector('.head').appendChild(a)
  }
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; el.appendChild(n) }
  root.appendChild(el)
}
</script>
</body>
</html>
