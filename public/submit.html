<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>curvebook submission</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg:#f6f4ef; --surface:#fff; --ink:#17171a; --muted:#5d5d66; --line:#e2ded5; --accent:#e8590c; --ok:#2b8a3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111114; --surface:#1a1a1f; --ink:#ececf1; --muted:#9a9aa6; --line:#2c2c33; --accent:#ff8a3d; --ok:#51cf66; } }
  * { box-sizing: border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 Inter,system-ui,-apple-system,'Segoe UI',sans-serif }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0 0 6px }
  .sub { color:var(--muted); margin:0 0 24px }
  .sub a { color:var(--accent) }
  .field { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:6px }
  .label { font-weight:650; font-size:14px }
  .note { color:var(--muted); font-size:13px; margin-top:6px }
  .val { white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px }
  .val.empty { color:var(--muted); font-style:italic }
  button { font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:5px 12px; cursor:pointer; flex:none }
  button.done { color:var(--ok); border-color:var(--ok) }
</style>
</head>
<body>
<main>
  <h1>curvebook: track submission</h1>
  <p class="sub">Answers for the <a href="https://superteam.fun/earn/listing/meteora-dbc">Meteora DBC listing</a> on Superteam Earn. Copy each field into the form.</p>
  <p class="sub"><strong>Changed on 2026-10-11:</strong> Project Description and Anything Else? (paste both again). Tweet Link only if you post the new tweet. Every other field is unchanged.</p>
  <div id="fields"></div>
</main>
<script>
const SITE = 'https://curvebook-kappa.vercel.app'
const F = [
  ["Link to Your Submission", "https://curvebook-kappa.vercel.app/demo", "Unchanged. Demo video page, with links to the app, examples and GitHub."],
  ["Tweet Link", "https://x.com/nayrbryanGaming/status/2108845716999422019", "Optional: post the new tweet below, then put its link here. The old tweet still pitches the earlier version."],
  ["New tweet (not a form field)", "On its curve, a @MeteoraAG DBC token's LP can look 100% locked. The config decides what happens at graduation.\n\n61% of 1,784 recent graduations were on configs leaving most LP withdrawable. 71% of those pools lost half their liquidity. Fully locked: 2%.\n\nhttps://curvebook-kappa.vercel.app", "Post on X fills it in. Attach x-demo.mp4 if you can.", "x"],
  ["Post for the Meteora dev Discord / Telegram (not a form field)", "Built a free, read-only check for DBC tokens and configs: https://curvebook-kappa.vercel.app\n\nPaste a token, DBC pool or config address and it flags mint authority, LP that is not permanently locked, fees that never decay, creator vesting and sniper advantage; for a graduated token it shows how much of the graduation liquidity is gone. Before graduation a token checker reads the DBC pool as locked, so the config is the only place this shows. Same report as JSON for terminals (GET /api/check?address=...) and from CI: npx tsx scripts/check.ts <config> (exit 1 on a red flag). Repo: https://github.com/bryankwandou/curvebook\n\nData behind it: of 1,784 recent graduations, 61% were on configs leaving most of the LP withdrawable, and 71% of those pools have since lost half their liquidity (2% on fully locked configs). In at least 86 DAMM v2 pools it left within 10 minutes of graduating. Method and control are on the site.\n\nIf you run a launchpad on DBC, I'd value 2 minutes: run it on your config and tell me what it gets wrong or misses.", "Discord: discord.com/channels/841152225564950528/864859354335412224 · Telegram: t.me/meteora_dev (both from the listing). Answer replies yourself; their feedback is the traction."],
  ["Project Name", "curvebook"],
  ["Project Description", "curvebook checks a Meteora DBC token or config before you buy or launch on it, and shows whether its liquidity can be pulled after graduation.\n\nIn our 2026-10-10 scan of 1,784 recent DBC graduations on mainnet, 61% graduated on configs that leave half or more of the LP withdrawable by the launchpad or creator, and 71% of those pools have since lost half or more of the liquidity they graduated with. On configs that use DBC's permanent lock for all LP, 2% did. In at least 86 DAMM v2 pools the liquidity was removed within 10 minutes of graduating.\n\nBefore graduation this is easy to miss. While a token is on its curve, the DBC pool holds the liquidity, so it reads as locked: on 2026-10-11 RugCheck showed no risks for token 2uH4…azcJ and its DBC market as 100% LP-locked. Its config lets the partner withdraw 89% of the LP at graduation, and 49 of the 50 recent graduations we measured on that config lost half or more of their liquidity. Only the config account says this.\n\nPaste a token, DBC pool or config. curvebook finds the config, reads it from mainnet and flags LP that is not permanently locked, mint authority kept, fees that never decay, creator vesting, and how far ahead early buyers are at graduation. For a graduated token it reads the migration transaction and the DAMM pool today and shows how much of the liquidity is gone. The same report is a free JSON API and SVG badge for trading terminals (/api/check, /api/badge) and a CLI that exits 1 on a red flag, so a launchpad can stop a bad config in CI. A launchpad for stocks or RWAs on DBC can put the badge on every listing to show buyers the graduation LP is locked. Four configs that pass every check are live on mainnet as a starting point.\n\nHow we checked our numbers: the scan and the study rerun daily in GitHub Actions, and CI fails if the locked control starts losing liquidity. Losses are a lower bound. We confirmed cases by hand on Solscan, including a pool where removeAllLiquidity ran 3 min 23 s after graduation. The full DBC lifecycle (launch, buy to 100%, migrateToDammV2, LP permanently locked on DAMM v2) runs on devnet, and one token is launched on mainnet on our Flat Fair config.\n\nNo outside users yet. Next: one launchpad running the check in CI and one terminal showing the badge.", "Changed 2026-10-11: paste this over the old text in the form."],
  ["Project Github Link", "https://github.com/bryankwandou/curvebook"],
  ["Project Website", "https://curvebook-kappa.vercel.app"],
  ["Project X Link", "https://x.com/nayrbryanGaming"],
  ["Link to your pitch deck or Loom/video presentation", "https://curvebook-kappa.vercel.app/demo"],
  ["Did you submit this project to the official Crypto World's Fair Hackathon on Colosseum? (Yes/No)", "No", "curvebook is not a Colosseum project. Do not link Commish here."],
  ["Link to Colosseum project", "", "Leave empty."],
  ["Link to your project's Colosseum profile", "https://colosseum.com/arena/profiles/nayrbryanGaming"],
  ["Anything Else?", "Try it, one click each:\n- LP pulled after graduation: https://curvebook-kappa.vercel.app/?config=USTdxXk3BZTAX43TjAbrS4Hnb1iVVyvGeqtkvLzLPGJ#inspect\n- All LP locked: https://curvebook-kappa.vercel.app/?config=75qK2pbYCbA85pnHh14q1r24UBpN3xFGNPVwNB5DQrus#inspect\n- Still on the curve, 89% of the LP withdrawable at graduation (the RugCheck example): https://curvebook-kappa.vercel.app/?config=2uH4eUFALeLcG1eZz4feAMkHU7LGxQBUnxwSWXRvazcJ#inspect\n- API: https://curvebook-kappa.vercel.app/api/check?address=2uH4eUFALeLcG1eZz4feAMkHU7LGxQBUnxwSWXRvazcJ\n- Badge: https://curvebook-kappa.vercel.app/api/badge?address=2uH4eUFALeLcG1eZz4feAMkHU7LGxQBUnxwSWXRvazcJ\n\nReproduce (public repo; the scans need your own RPC URL):\n- npm test: risk rules, preset math, the published numbers and the study's control (also runs in CI)\n- npx tsx scripts/check.ts ADDRESS: the CLI check (ADDRESS = any token, DBC pool or config)\n- scripts/scan-graduations.ts and scripts/lp-outcomes.ts: the scan and the liquidity study (graduated-configs.json, lp-outcomes.json, refreshed daily by .github/workflows/data.yml)\n- scripts/verify-mainnet.ts: reads the 4 live configs back from mainnet, 80 checks\n- scripts/devnet-graduate.ts: launch, buy to 100% and migrateToDammV2 on devnet (devnet-graduation.json)\n\nOn mainnet:\n- configs: flat-fair 7Cybv7xUZn3JhvZfGQF9h9s7bLWQhNNcqs1yQVGPprPK, early-discovery FnKvUoL12VZacUE2k4EwhFXHn2xxhoG1wvQYsfgBSsLT, long-curve 6aHuAvXw3BYgR5Wrht8neBPXpmGQej7YWhBK9gbDyf93, stock-pair-usdc 4i2iNBaHyJbbZL5q3TVRudzySRbf8NV3BmhscAiQTEhU\n- launch on flat-fair, createPool tx 5ieP6wibq9FN1vC5fGXwAFrZkKBEjeHQ27ZFnMSyeg6p2PBQ8vDL5WhZnnAwZHYfjTKFKsZcjHjN8KH1dsrZw3Pu\n\nThe README covers the method and its limits: how the DAMM v2 lock holds (read from the program source), why losses are a lower bound, what the scan samples, and how the listing share depends on its thresholds. Video: https://curvebook-kappa.vercel.app/x-demo.mp4", "Changed 2026-10-11: paste this over the old text in the form."]
]
const root = document.getElementById('fields')
for (const [label, value, note] of F) {
  const el = document.createElement('div')
  el.className = 'field'
  el.innerHTML = `<div class="head"><span class="label"></span></div><div class="val"></div>`
  el.querySelector('.label').textContent = label
  const v = el.querySelector('.val')
  v.textContent = value || '(empty)'
  if (!value) v.classList.add('empty')
  if (value) {
    const b = document.createElement('button')
    b.textContent = 'Copy'
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = 'Copied'; b.classList.add('done') }
      catch { const r = document.createRange(); r.selectNodeContents(v); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = 'Selected: Ctrl+C' }
    }
    el.querySelector('.head').appendChild(b)
  }
  if (value && F.find((f) => f[0] === label)[3] === 'x') {
    const a = document.createElement('a'); a.href = 'https://x.com/intent/post?text=' + encodeURIComponent(value); a.target = '_blank'; a.rel = 'noopener'
    a.textContent = 'Post on X'; a.style.cssText = 'margin-left:8px;font-size:13px;font-weight:600;color:var(--accent)'
    el.querySelector('.head').appendChild(a)
  }
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; el.appendChild(n) }
  root.appendChild(el)
}
</script>
</body>
</html>
